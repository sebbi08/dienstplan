services:
  dienstplan:
    build: .
    image: dienstplan:latest
    restart: unless-stopped
    environment:
      NUXT_SESSION_PASSWORD: ${NUXT_SESSION_PASSWORD:?NUXT_SESSION_PASSWORD fehlt in .env}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?ADMIN_PASSWORD fehlt in .env}
      ADMIN_RESET_PASSWORD: ${ADMIN_RESET_PASSWORD:-}
      NUXT_SESSION_COOKIE_SECURE: ${NUXT_SESSION_COOKIE_SECURE:-true}
    volumes:
      - dienstplan-data:/data
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:3000:3000"

  caddy:
    image: caddy:2
    profiles: ["https"]
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN:-localhost}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - dienstplan

volumes:
  dienstplan-data:
  caddy-data:
  caddy-config:
